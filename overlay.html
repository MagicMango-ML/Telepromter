<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Teleprompter · See-through</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }

  .topbar {
    flex: 0 0 auto; padding: 10px 14px;
    background: rgba(17,17,17,0.9);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: relative; z-index: 4;
  }
  .topbar button, .topbar a.btn {
    background: #222; color: #fff; border: 1px solid #333;
    padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 14px;
    font-family: inherit; text-decoration: none; display: inline-block;
  }
  .topbar button:hover, .topbar a.btn:hover { background: #2a2a2a; }
  .topbar button.primary { background: #c8102e; border-color: #c8102e; }
  .topbar button.primary:hover { background: #e01233; }
  .topbar label { font-size: 13px; color: #aaa; display: flex; align-items: center; gap: 6px; }
  .topbar input[type=range] { width: 110px; }
  .topbar .spacer { flex: 1; }
  .topbar .hint { font-size: 12px; color: #888; }
  .topbar .val { color: #fff; min-width: 28px; text-align: right; font-variant-numeric: tabular-nums; }

  .stage {
    flex: 1 1 auto; position: relative; overflow: hidden;
    background: transparent;
  }
  .stage.mirror .scroller-inner { transform: scaleX(-1); }

  .guide {
    position: absolute; left: 0; right: 0; top: 18%;
    border-top: 2px solid rgba(200,16,46,0.7);
    pointer-events: none; z-index: 2;
  }
  .guide::before, .guide::after {
    content: ''; position: absolute; top: -7px;
    width: 0; height: 0;
    border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  }
  .guide::before { left: 0; border-left: 10px solid rgba(200,16,46,0.9); }
  .guide::after  { right: 0; border-right: 10px solid rgba(200,16,46,0.9); }

  .scroller {
    position: absolute; left: 0; right: 0; top: 100%;
    padding: 0 8vw 80vh 8vw; will-change: transform;
  }
  .scroller-inner { opacity: 0.5; }
  .scroller p {
    font-size: 56px; line-height: 1.4; font-weight: 700;
    margin: 0 0 0.9em 0; letter-spacing: 0.005em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.85), 0 0 2px rgba(0,0,0,0.85);
  }
  .scroller p.cue {
    color: #c8102e; font-size: 24px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.12em; margin: 1.4em 0 0.4em 0;
  }

  .editor {
    position: absolute; inset: 0; background: #0a0a0a; z-index: 5;
    display: none; flex-direction: column; padding: 20px;
  }
  .editor.open { display: flex; }
  .editor h2 { margin: 0 0 12px 0; font-size: 16px; color: #aaa; font-weight: 500; }
  .editor textarea {
    flex: 1; width: 100%; background: #000; color: #fff;
    border: 1px solid #333; border-radius: 6px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 15px; padding: 14px; resize: none; line-height: 1.6;
  }
  .editor .row { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
  .editor .row .hint { color: #666; font-size: 12px; margin-left: auto; }
  .editor button {
    background: #222; color: #fff; border: 1px solid #333;
    padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
    font-family: inherit;
  }
  .editor button.primary { background: #c8102e; border-color: #c8102e; }
</style>
</head>
<body>

<div class="topbar">
  <button id="play" class="primary">▶ Play</button>
  <button id="restart">⟲ Restart</button>
  <label>Speed <input id="speed" type="range" min="20" max="300" value="80" /> <span class="val" id="speedVal">80</span></label>
  <label>Size <input id="size" type="range" min="28" max="120" value="56" /> <span class="val" id="sizeVal">56</span></label>
  <label>See-through <input id="opacity" type="range" min="20" max="100" value="50" /> <span class="val" id="opacityVal">50%</span></label>
  <button id="mirror">Mirror: off</button>
  <button id="edit">Edit script</button>
  <button id="reset" title="Reset to the Magic Mango welcome script">Reset</button>
  <button id="fullscreen">Fullscreen</button>
  <a class="btn" href="./" title="Back to standard teleprompter">Standard mode →</a>
  <div class="spacer"></div>
  <span class="hint">Space play · ↑↓ speed · ← restart · F fullscreen · E edit</span>
</div>

<div class="stage" id="stage">
  <div class="guide"></div>
  <div class="scroller" id="scroller">
    <div class="scroller-inner" id="scrollerInner"></div>
  </div>
</div>

<div class="editor" id="editor">
  <h2>Script — blank lines separate paragraphs · lines like [Hook] become red cue labels</h2>
  <textarea id="script" spellcheck="false"></textarea>
  <div class="row">
    <button id="saveScript" class="primary">Save &amp; close</button>
    <button id="cancelEdit">Cancel</button>
    <span class="hint">Kept only for this tab — closing the tab clears it</span>
  </div>
</div>

<script>
const DEFAULT_SCRIPT = `[Welcome]

This is the Magic Mango Telepromter.

Use this if you need help reading scripts — for example a podcast or similar.

// Mango`;

const stage = document.getElementById('stage');
const scroller = document.getElementById('scroller');
const scrollerInner = document.getElementById('scrollerInner');
const playBtn = document.getElementById('play');
const restartBtn = document.getElementById('restart');
const speedSlider = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
const sizeSlider = document.getElementById('size');
const sizeVal = document.getElementById('sizeVal');
const opacitySlider = document.getElementById('opacity');
const opacityVal = document.getElementById('opacityVal');
const mirrorBtn = document.getElementById('mirror');
const editBtn = document.getElementById('edit');
const resetBtn = document.getElementById('reset');
const fsBtn = document.getElementById('fullscreen');
const editor = document.getElementById('editor');
const scriptArea = document.getElementById('script');
const saveBtn = document.getElementById('saveScript');
const cancelBtn = document.getElementById('cancelEdit');

let y = 0, playing = false, lastT = 0, pxPerSec = 80;

function applySize(px) {
  document.querySelectorAll('.scroller p:not(.cue)').forEach(p => p.style.fontSize = px + 'px');
}

function loadScript(text) {
  sessionStorage.setItem('tpo_script', text);
  scrollerInner.innerHTML = '';
  const blocks = text.split(/\n\n+/);
  for (const block of blocks) {
    const trimmed = block.trim();
    if (!trimmed) continue;
    const p = document.createElement('p');
    if (/^\[.+\]$/.test(trimmed)) {
      p.className = 'cue';
      p.textContent = trimmed.replace(/^\[|\]$/g, '');
    } else {
      p.textContent = trimmed;
    }
    scrollerInner.appendChild(p);
  }
  applySize(sizeSlider.value);
  reset();
}

function reset() {
  y = 0;
  scroller.style.transform = 'translateY(0px)';
  playing = false;
  updatePlayBtn();
}

function tick(t) {
  const dt = lastT ? (t - lastT) / 1000 : 0;
  lastT = t;
  if (playing) {
    y += pxPerSec * dt;
    scroller.style.transform = `translateY(${-y}px)`;
    if (y > scroller.scrollHeight + stage.clientHeight) {
      playing = false; updatePlayBtn();
    }
  }
  requestAnimationFrame(tick);
}

function updatePlayBtn() {
  playBtn.textContent = playing ? '⏸ Pause' : '▶ Play';
}

playBtn.addEventListener('click', () => { playing = !playing; updatePlayBtn(); });
restartBtn.addEventListener('click', reset);

speedSlider.addEventListener('input', () => {
  pxPerSec = +speedSlider.value;
  speedVal.textContent = pxPerSec;
  localStorage.setItem('tpo_speed', pxPerSec);
});
sizeSlider.addEventListener('input', () => {
  applySize(sizeSlider.value);
  sizeVal.textContent = sizeSlider.value;
  localStorage.setItem('tpo_size', sizeSlider.value);
});
opacitySlider.addEventListener('input', () => {
  const v = +opacitySlider.value;
  // Stage applies the opacity so guide line stays solid; fall back if mirrored
  scrollerInner.style.opacity = v / 100;
  opacityVal.textContent = v + '%';
  localStorage.setItem('tpo_opacity', v);
});

mirrorBtn.addEventListener('click', () => {
  stage.classList.toggle('mirror');
  const on = stage.classList.contains('mirror');
  mirrorBtn.textContent = 'Mirror: ' + (on ? 'on' : 'off');
  localStorage.setItem('tpo_mirror', on ? '1' : '0');
});

editBtn.addEventListener('click', () => {
  scriptArea.value = sessionStorage.getItem('tpo_script') || DEFAULT_SCRIPT;
  editor.classList.add('open');
  scriptArea.focus();
});
saveBtn.addEventListener('click', () => {
  loadScript(scriptArea.value);
  editor.classList.remove('open');
});
cancelBtn.addEventListener('click', () => editor.classList.remove('open'));
resetBtn.addEventListener('click', () => {
  if (!confirm('Reset to the Magic Mango welcome script? Your current script in this tab will be lost.')) return;
  sessionStorage.removeItem('tpo_script');
  loadScript(DEFAULT_SCRIPT);
});

fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});

document.addEventListener('keydown', (e) => {
  if (editor.classList.contains('open')) return;
  if (e.code === 'Space') { e.preventDefault(); playing = !playing; updatePlayBtn(); }
  else if (e.key === 'ArrowUp')   { speedSlider.value = Math.min(300, +speedSlider.value + 10); speedSlider.dispatchEvent(new Event('input')); }
  else if (e.key === 'ArrowDown') { speedSlider.value = Math.max(20,  +speedSlider.value - 10); speedSlider.dispatchEvent(new Event('input')); }
  else if (e.key === 'ArrowLeft') { reset(); }
  else if (e.key.toLowerCase() === 'f') { fsBtn.click(); }
  else if (e.key.toLowerCase() === 'e') { editBtn.click(); }
});

// init
const savedScript  = sessionStorage.getItem('tpo_script') || DEFAULT_SCRIPT;
const savedSpeed   = +(localStorage.getItem('tpo_speed')   || 80);
const savedSize    = +(localStorage.getItem('tpo_size')    || 56);
const savedOpacity = +(localStorage.getItem('tpo_opacity') || 50);
const savedMirror  = localStorage.getItem('tpo_mirror') === '1';

speedSlider.value   = savedSpeed; pxPerSec = savedSpeed; speedVal.textContent = savedSpeed;
sizeSlider.value    = savedSize;  sizeVal.textContent   = savedSize;
opacitySlider.value = savedOpacity;
scrollerInner.style.opacity = savedOpacity / 100;
opacityVal.textContent = savedOpacity + '%';
if (savedMirror) { stage.classList.add('mirror'); mirrorBtn.textContent = 'Mirror: on'; }

loadScript(savedScript);
requestAnimationFrame(tick);
</script>

</body>
</html>
